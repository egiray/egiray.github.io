<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kelime Birleştir — Reklam Filmi</title>
    <meta name="robots" content="noindex" />
    <meta property="og:title" content="Kelime Birleştir — Reklam Filmi" />
    <meta
      property="og:description"
      content="Üç uzunlukta reklam filmi: 30 saniye, 15 saniye, 6 saniye."
    />
    <meta property="og:image" content="poster_30s.jpg" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, sans-serif;
        line-height: 1.6;
        color: #e8f4f8;
        background: #0a1c2e;
        background-image: radial-gradient(
          ellipse at 50% -10%,
          #143a5a 0%,
          #0a1c2e 60%
        );
        min-height: 100vh;
        padding: 48px 20px 64px;
      }
      .wrap {
        max-width: 1080px;
        margin: 0 auto;
      }
      header {
        text-align: center;
        margin-bottom: 44px;
      }
      h1 {
        font-size: 2em;
        letter-spacing: -0.02em;
        margin-bottom: 8px;
      }
      .sub {
        color: #8fb8cf;
        font-size: 1em;
      }
      .films {
        display: flex;
        flex-wrap: wrap;
        gap: 32px;
        justify-content: center;
        align-items: flex-start;
      }
      .film {
        width: 300px;
        max-width: 100%;
      }
      .phone {
        aspect-ratio: 9 / 16;
        border-radius: 22px;
        overflow: hidden;
        background: #000;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55),
          0 0 0 1px rgba(255, 255, 255, 0.09);
      }
      video {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        background: #000;
      }
      .label {
        margin-top: 14px;
        text-align: center;
      }
      .label b {
        display: block;
        font-size: 1.05em;
      }
      .label span {
        color: #8fb8cf;
        font-size: 0.88em;
      }
      footer {
        margin-top: 56px;
        text-align: center;
        color: #6f97ae;
        font-size: 0.85em;
      }
      footer a {
        color: #8fb8cf;
      }
      @media (max-width: 700px) {
        body {
          padding-top: 32px;
        }
        .film {
          width: 100%;
          max-width: 340px;
        }
        .films {
          gap: 36px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Kelime Birleştir</h1>
        <p class="sub">Reklam filmi — üç uzunluk</p>
      </header>

      <div class="films">
        <div class="film">
          <div class="phone">
            <video
              src="reklam_30s.mp4"
              poster="poster_30s.jpg"
              controls
              playsinline
              preload="metadata"
            ></video>
          </div>
          <p class="label"><b>30 saniye</b><span>Tam hikâye</span></p>
        </div>

        <div class="film">
          <div class="phone">
            <video
              src="reklam_15s.mp4"
              poster="poster_15s.jpg"
              controls
              playsinline
              preload="metadata"
            ></video>
          </div>
          <p class="label"><b>15 saniye</b><span>Kısa kurgu</span></p>
        </div>

        <div class="film">
          <div class="phone">
            <video
              src="reklam_6s.mp4"
              poster="poster_6s.jpg"
              controls
              playsinline
              preload="metadata"
            ></video>
          </div>
          <p class="label"><b>6 saniye</b><span>Atlanamayan reklam</span></p>
        </div>
      </div>

      <footer>
        <p>Sesi açmayı unutmayın.</p>
      </footer>
    </div>

    <script>
      // Bir video oynarken diğerleri sussun.
      const videos = document.querySelectorAll("video");
      videos.forEach((v) =>
        v.addEventListener("play", () =>
          videos.forEach((o) => o !== v && o.pause())
        )
      );
    </script>
  </body>
</html>
